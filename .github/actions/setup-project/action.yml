name: Setup project
description: Install Node.js (version from .nvmrc) and all workspace dependencies.

runs:
  using: composite
  steps:
    - name: Setup Node.js (with npm cache)
      if: hashFiles('package-lock.json') != ''
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Setup Node.js
      if: hashFiles('package-lock.json') == ''
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc

    - name: Install dependencies
      shell: bash
      run: |
        if [[ -f package-lock.json ]]; then
          npm ci
        else
          # The base repo ships without a lockfile; platform templates commit one.
          npm install --no-audit --no-fund
        fi
